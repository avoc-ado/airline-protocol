[package]
name = "pyth_receiver_mock"
version = "0.1.0"
description = "Mock Pyth receiver for localnet tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pyth_receiver_mock"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(feature, values(\"custom-heap\", \"custom-panic\", \"anchor-debug\"))",
  "cfg(target_os, values(\"solana\"))"
] }
